<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap"
      rel="stylesheet"
    />
    <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css"
    rel="stylesheet"
  />
    <title>Notes App</title>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Notes App</h1>
        <div class="header-actions">
          <button id="select-mode-btn" class="btn">Вибрати</button>
          <button id="share-btn" class="btn hidden">Поділитися (<span id="count">0</span>)</button>
          <button class="note-add" type="button"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>
      <script type="module">
        // Імпортуємо необхідні модулі
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
          getFirestore, 
          collection, 
          addDoc, 
          getDoc, 
          doc 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCIA4nwiyO-sjeOAKFHLHhR9_gbpRXX4yg",
          authDomain: "note-app-op.firebaseapp.com",
          projectId: "note-app-op",
          storageBucket: "note-app-op.firebasestorage.app",
          messagingSenderId: "363868833064",
          appId: "1:363868833064:web:36a9598cc3cac09afc3c1d",
          measurementId: "G-F01HCTG4E3"
        };

        // Ініціалізація
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Експортуємо функції у глобальну область, щоб app.js міг їх бачити
        window.db = db;
        window.fbMethods = { collection, addDoc, getDoc, doc };
      </script>
      <div class="notes"></div>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
