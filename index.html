<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css"
      rel="stylesheet"
    />
    <title>Notes App</title>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Notes App</h1>
        <div class="header-actions">
          <button id="select-mode-btn" class="btn">Вибрати</button>
          <button id="share-btn" class="btn hidden">Поділитися (<span id="count">0</span>)</button>
          <button class="note-add" type="button"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>

      <div class="notes"></div>
    </div>

    <div id="share-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Поділитися нотатками</h3>
        <p>Ваше посилання готове:</p>
        <div class="copy-box">
          <input type="text" id="share-url" readonly />
          <button id="copy-btn" title="Скопіювати">
            <i class="fa-regular fa-copy"></i>
          </button>
        </div>
        <button id="close-modal" class="btn-close">Закрити</button>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { 
        getFirestore, 
        collection, 
        addDoc, 
        getDoc, 
        doc 
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCIA4nwiyO-sjeOAKFHLHhR9_gbpRXX4yg",
        authDomain: "note-app-op.firebaseapp.com",
        projectId: "note-app-op",
        storageBucket: "note-app-op.firebasestorage.app",
        messagingSenderId: "363868833064",
        appId: "1:363868833064:web:36a9598cc3cac09afc3c1d",
        measurementId: "G-F01HCTG4E3"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window.db = db;
      window.fbMethods = { collection, addDoc, getDoc, doc };
    </script>
    
    <script src="js/app.js"></script>
  </body>
</html>
